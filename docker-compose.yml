services:
  frontend:
    container_name: carti-frontend-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://hub.carti.com.mx}
    image: carti-frontend-img:latest
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
